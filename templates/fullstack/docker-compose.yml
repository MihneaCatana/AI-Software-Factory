services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory_dev
      POSTGRES_PASSWORD: local_dev_only_change_me # local development ONLY
      POSTGRES_DB: factory_generated
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_dev -d factory_generated"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - local_dev_pg:/var/lib/postgresql/data
volumes:
  local_dev_pg:
